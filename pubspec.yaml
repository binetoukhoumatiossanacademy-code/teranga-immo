name: teranga_immo
description: Application immobilière Teranga Immo — Sénégal — BK Technologies.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.17.2
  flutter_svg: ^2.1.0
  flutter_lucide: ^1.8.2
dev_dependencies:
  http: ^1.6.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo_original.png
    - assets/brand/teranga_mark.svg
    - assets/brand/web_icons/
    - assets/homes/
  fonts:
    - family: Cormorant Garamond
      fonts:
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Variable.ttf
          weight: 400
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Variable.ttf
          weight: 500
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Variable.ttf
          weight: 600
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Variable.ttf
          weight: 700
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/cormorant_garamond/CormorantGaramond-Italic-Variable.ttf
          weight: 500
          style: italic
    - family: DM Sans
      fonts:
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
          weight: 500
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/dm_sans/DMSans-Variable.ttf
          weight: 700
