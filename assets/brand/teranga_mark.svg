<svg viewBox="0 0 120 132" xmlns="http://www.w3.org/2000/svg">
<g fill="#B18A43">
  <!-- Roof: two tapered strokes meeting at apex, evoking a pediment -->
  <path d="M 60,3 Q 38,9 15,35 Q 39,20 60,11 Z"/>
  <path d="M 60,3 Q 82,9 105,35 Q 81,20 60,11 Z"/>

  <!-- T letter: one continuous outline (bar + stem + flared base), no seams -->
  <path d="
    M 27,36
    L 71,36
    C 73.8,36.3 75.4,37.6 75,39.8
    C 74.6,42 72.6,43.1 70,43.4
    L 52.7,43.4
    L 52.7,89.3
    C 58.2,89.5 61.6,90.6 62.4,93.6
    C 62.9,95.5 61.9,97 59.4,97.3
    L 38.6,97.3
    C 36.1,97 35.1,95.5 35.6,93.6
    C 36.4,90.6 39.8,89.5 45.3,89.3
    L 45.3,43.4
    L 28,43.4
    C 25.4,43.1 23.4,42 23,39.8
    C 22.6,37.6 24.2,36.3 27,36
    Z"/>

  <!-- i letter (lowercase, no dot): matching flared cap + stem + base -->
  <path d="
    M 75,54
    L 90,54
    C 91.9,54.2 93.1,55.1 92.8,56.7
    C 92.5,58.2 91,59 89,59.2
    L 86.3,59.2
    L 86.3,89.3
    C 90.2,89.5 92.8,90.4 93.4,92.8
    C 93.8,94.3 93,95.5 91,95.7
    L 74,95.7
    C 72,95.5 71.2,94.3 71.6,92.8
    C 72.2,90.4 74.8,89.5 78.7,89.3
    L 78.7,59.2
    L 76,59.2
    C 74,59 72.5,58.2 72.2,56.7
    C 71.9,55.1 73.1,54.2 75,54
    Z"/>

  <!-- base line (plinth), thin tapered arc beneath both letters -->
  <path d="M 17,110 Q 60,101.5 103,110 Q 60,105.8 17,110 Z"/>
</g>
</svg>